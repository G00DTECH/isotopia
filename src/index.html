<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <!-- Lock the viewport so iPad Safari can't pinch/double-tap zoom the game.
       viewport-fit=cover lets it fill past the notch/home-indicator area. -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Isotopia</title>
  <script src="game.js"></script>
  <!-- GBA-style pixel font for the battle textbox (falls back to monospace offline). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./index.css">
</head>

<body>
  <div id="game-container">
    <div id="phaser-game"></div>
  </div>
  <div id="hud">
    <span class="hud-title">Isotopia</span>
    <span><b>Tap</b> to walk · walk up to an <b>Elemental</b> to quiz it</span>
    <span>Step on a glowing <b>▲/▼</b> pad to enter or leave a building</span>
    <span>Top-right = your <b>collection</b></span>
  </div>
</body>

</html>
