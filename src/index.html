<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <!-- Lock the viewport so iPad Safari can't pinch/double-tap zoom the game.
       viewport-fit=cover lets it fill past the notch/home-indicator area. -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Isotopia</title>
  <script src="game.js"></script>
  <link rel="stylesheet" href="./index.css">
</head>

<body>
  <div id="game-container">
    <div id="phaser-game"></div>
  </div>
  <div id="hud">
    <span class="hud-title">🧪 Isotopia</span>
    <span><b>Tap</b> where you want to walk</span>
    <span>Walk up to an <b>Elemental</b> to start its quiz</span>
    <span>Tap the <b>DEX</b> (top-right) to see your collection</span>
    <span>Enter the <b>SHOP</b>, <b>LAB</b> &amp; <b>HOME</b> to find them all</span>
  </div>
</body>

</html>
